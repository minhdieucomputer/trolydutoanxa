
name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cai thu vien
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Dong goi phan mem
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name TroLyDuToanXa --add-data "templates;templates" --add-data "mlns_loai_khoan.csv;." app.py

      - name: Tao Setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "Khong tim thay Inno Setup 6"
          }
          & $iscc installer.iss

      - name: Tai bo cai
        uses: actions/upload-artifact@v4
        with:
          name: Setup_TroLyDuToanXa_Windows
          path: |
            Output/*.exe
            output/*.exe
          if-no-files-found: error
